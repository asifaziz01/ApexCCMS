services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://ccms_app:change-me-local-only@postgres:5432/northern_star_ccms
      CORS_ORIGIN: http://localhost:8080
      REQUIRE_AUTH: "false"
      # Development tenant UUID; replace with the seeded institution UUID in a real environment.
      INSTITUTION_ID: 00000000-0000-4000-8000-000000000001
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: northern-star-ccms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: northern_star_ccms
      POSTGRES_USER: ccms_app
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - ccms_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccms_app -d northern_star_ccms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ccms_postgres_data:
